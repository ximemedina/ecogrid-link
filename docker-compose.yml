services:
  # 1. Proxy Inverso - Única Puerta de Entrada HTTP (Puerto 80)
  nginx:
    image: nginx:alpine
    container_name: ecogrid_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - grafana
    networks:
      - ecogrid_net
    restart: always

  # 2. Broker MQTT - Mensajería IoT
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ecogrid_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ecogrid_net
    restart: always

  # 3. Base de Datos Centralizada - MySQL
  mysql:
    image: mysql:8.0
    container_name: ecogrid_db
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ecogrid_link_db}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_password}
      - MYSQL_USER=${MYSQL_USER:-ecogrid_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ecogrid_user_password}
    ports:
      - "3306:3306" # Mapeado para que el Integrante 2 conecte Grafana / phpMyAdmin
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecogrid_net
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. Panel de Administración de DB - phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecogrid_phpmyadmin
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_password}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - ecogrid_net
    restart: always

  # 5. Microservicio de Backend (FastAPI / Python)
  backend:
    build: ./backend
    container_name: ecogrid_backend
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-ecogrid_user}:${MYSQL_PASSWORD:-ecogrid_user_password}@mysql/${MYSQL_DATABASE:-ecogrid_link_db}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - UMBRAL_SOBRECARGA_WATTS=${UMBRAL_SOBRECARGA_WATTS:-50.0}
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - ecogrid_net
    restart: always

  # 6. Visualización en tiempo real - Grafana (Integrante 2)
  grafana:
    image: grafana/grafana:latest
    container_name: ecogrid_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana_admin_password}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/dashboard/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - MYSQL_USER=${MYSQL_USER:-ecogrid_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ecogrid_user_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ecogrid_link_db}
    ports:
      - "3000:3000" # Acceso directo opcional, además del proxy en /dashboard/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecogrid_net
    restart: always

networks:
  ecogrid_net:
    driver: bridge

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
  grafana_data:
