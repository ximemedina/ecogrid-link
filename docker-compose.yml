version: '3.8'

services:
  # 1. Proxy Inverso - Única Puerta de Entrada HTTP (Puerto 80)
  nginx:
    image: nginx:alpine
    container_name: ecogrid_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - ecogrid_net
    restart: always

  # 2. Broker MQTT - Mensajería IoT
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ecogrid_mqtt
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ecogrid_net
    restart: always

  # 3. Base de Datos Centralizada - MySQL
  mysql:
    image: mysql:8.0
    container_name: ecogrid_db
    environment:
      - MYSQL_DATABASE=ecogrid_link_db
      - MYSQL_ROOT_PASSWORD=root_secure_password
      - MYSQL_USER=ecogrid_user
      - MYSQL_PASSWORD=ecogrid_user_password
    ports:
      - "3306:3306" # Mapeado para que el Integrante 2 conecte Grafana / phpMyAdmin
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecogrid_net
    restart: always

  # 4. Panel de Administración de DB - phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecogrid_phpmyadmin
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=root_secure_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - ecogrid_net
    restart: always

  # 5. Microservicio de Backend (FastAPI / Python)
  backend:
    build: ./backend
    container_name: ecogrid_backend
    environment:
      - DATABASE_URL=mysql+pymysql://ecogrid_user:ecogrid_user_password@mysql/ecogrid_link_db
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mysql
      - mosquitto
    networks:
      - ecogrid_net
    restart: always

networks:
  ecogrid_net:
    driver: bridge

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
