events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # DNS embebido de Docker: resuelve los nombres de servicio en cada
    # request (en vez de una sola vez al arrancar), para que nginx no se
    # quede con una IP vieja cuando se reconstruye/recrea otro contenedor.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Redirección del tráfico API hacia el microservicio FastAPI
        # (con una variable en proxy_pass, nginx ya NO recorta el prefijo de
        # la location automáticamente, por eso se hace explícito con rewrite)
        location /api/ {
            set $backend_upstream backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirección del tráfico del Dashboard hacia Grafana
        # (aquí SÍ se conserva el prefijo /dashboard/, porque Grafana corre
        # con GF_SERVER_SERVE_FROM_SUB_PATH=true y lo espera intacto)
        location /dashboard/ {
            set $grafana_upstream grafana:3000;
            proxy_pass http://$grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte para WebSockets (Grafana Live)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Página raíz básica
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
    }
}
